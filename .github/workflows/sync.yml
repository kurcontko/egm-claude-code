name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Rebuild from upstream main
        run: python scripts/sync_upstream.py --ref main

      - name: Open a pull request if upstream changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Already in sync."
            exit 0
          fi
          commit=$(python -c "import json; print(json.load(open('upstream.json'))['commit'][:7])")
          branch="sync/upstream-${commit}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Sync upstream google/elephant-goldfish-model@${commit}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Sync upstream google/elephant-goldfish-model@${commit}" \
            --body "Rebuilt \`plugins/egm\` from upstream \`${commit}\` with \`scripts/sync_upstream.py\`. Review the upstream diff, then run \`tests/live_probe.py\` locally before merging."
